version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The obsidian typings are pinned and must not be newer than minAppVersion
      # (enforced by src/__tests__/integrity.test.ts). Bump them by hand together
      # with minAppVersion.
      - dependency-name: "obsidian"
      # typescript-eslint supports TypeScript >=4.8.4 <6.1.0, and TypeScript 7 drops the
      # JavaScript compiler API it needs. Raise this once typescript-eslint supports newer versions.
      - dependency-name: "typescript"
        versions: [">=6.1"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
