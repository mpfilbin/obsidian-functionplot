docs:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "images/**/*"

code:
  - changed-files:
      - any-glob-to-any-file: "src/**/*.ts"

style:
  - changed-files:
      - any-glob-to-any-file: "src/styles.scss"

automation:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/*"

invalid:
  - changed-files:
      - any-glob-to-any-file:
          - "LICENSE"
          - "versions.json"
